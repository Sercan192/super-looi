name: Build Super-LOOI APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@9.15.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
      - run: |
          sed -i 's/if (thin.status !== 0)/if (false)/g' apps/nsh/scripts/prepare-sherpa-kws.mjs
          pnpm install --frozen-lockfile
          pnpm build
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - run: |
          NSH_DIR=$(find ~/.cache/super-looi/nsh -maxdepth 2 -name "Cargo.toml" -exec dirname {} \; | head -n 1)
          cd "$NSH_DIR"
          cargo xtask android --dev
          mkdir -p ~/.cache/super-looi/nsh/dev-cli/android
          ln -sfn "$NSH_DIR/target/android/debug-dev" ~/.cache/super-looi/nsh/dev-cli/android/f4d68f7-8fbfa59a2f1c-dev
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - run: |
          pnpm --filter @super-looi/nsh exec node --import tsx scripts/nsh.ts build --target android || true
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
      - uses: actions/upload-artifact@v4
        with:
          name: super-looi-android
          path: |
            **/*.apk
            ~/.cache/super-looi/nsh/**/*.apk
