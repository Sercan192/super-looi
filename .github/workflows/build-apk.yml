name: Build Super-LOOI APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@9.15.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/28.2.13676358" >> $GITHUB_ENV
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
      - run: |
          sed -i 's/if (thin.status !== 0)/if (false)/g' apps/nsh/scripts/prepare-sherpa-kws.mjs
          pnpm install --frozen-lockfile
          pnpm build
      - run: |
          NSH_DIR=$(find ~/.cache/super-looi/nsh -maxdepth 3 -name "xtask" -exec dirname {} \; | head -n 1)
          cd "$NSH_DIR"
          cargo xtask android --dev
          mkdir -p ~/.cache/super-looi/nsh/dev-cli/android
          ln -sfn "$NSH_DIR/target/android/debug-dev" ~/.cache/super-looi/nsh/dev-cli/android/f4d68f7-8fbfa59a2f1c-dev
      - run: |
          cd $GITHUB_WORKSPACE
          node -e '
            const fs = require("fs");
            let code = fs.readFileSync("apps/nsh/scripts/nsh.ts", "utf8");
            code = code.replace(/if\s*\(\!connected\)[^\n]+/g, "");
            code = code.replace(/adb\s+devices/g, "printf \"List of devices attached\\ndummy\\tdevice\\n\"");
            code = code.replace(/spawnSync\("adb"[^\)]+\)/g, "{ status: 0, stdout: \"List of devices attached\\ndummy\\tdevice\\n\", stderr: \"\" }");
            fs.writeFileSync("apps/nsh/scripts/nsh.ts", code);
          '
          pnpm --filter @super-looi/nsh exec node --import tsx scripts/nsh.ts run --target android --device "dummy" || true
          mkdir -p $GITHUB_WORKSPACE/output-apks
          find ~/.cache/super-looi $GITHUB_WORKSPACE -type f -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output-apks/ \;
          ls -lh $GITHUB_WORKSPACE/output-apks/
      - uses: actions/upload-artifact@v4
        with:
          name: super-looi-android
          path: output-apks/*.apk
